<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تطبيق ملئ الازايز</title>

  <!-- ═══ وسوم PWA ═══ -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#C9A24B">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ملئ الأزايز">

  <!-- أيقونات التطبيق و PWA -->
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="theme-color" content="#101826">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      background: #0B1018;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
    }

    /* ═══ iframe الحامل للتطبيق ═══ */
    #appFrame {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: none; background: #101826;
      opacity: 0; transition: opacity .6s ease;
      z-index: 1;
    }
    #appFrame.show { opacity: 1; }

    /* ═══ شاشة الإقلاع ═══ */
    #splash {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background:
        radial-gradient(at 20% 0%, rgba(201,162,75,0.08) 0%, transparent 50%),
        linear-gradient(135deg, #0B1018 0%, #101826 50%, #16202F 100%);
      transition: opacity .8s ease, transform .8s ease;
    }
    #splash.hide {
      opacity: 0; transform: scale(1.08); pointer-events: none;
    }

    .splash-logo {
      width: 110px; height: 110px;
      display: flex; align-items: center; justify-content: center;
      font-size: 52px; color: #C9A24B;
      background: rgba(201,162,75,0.08);
      border: 2px solid rgba(201,162,75,0.25);
      border-radius: 30px;
      backdrop-filter: blur(12px);
      margin-bottom: 26px;
      animation: pulse 2.2s ease-in-out infinite;
      box-shadow: 0 8px 32px rgba(201,162,75,0.15);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .splash-title {
      color: #EDEFF3; font-size: 26px; font-weight: 700; margin-bottom: 8px;
    }
    .splash-sub {
      color: #8B96A8; font-size: 14px; font-weight: 500; margin-bottom: 42px;
    }

    .splash-loader {
      width: 220px; height: 5px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px; overflow: hidden;
    }
    .splash-loader span {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, #8E7333, #C9A24B, #D9B562);
      border-radius: 10px;
      animation: load 2.4s ease forwards;
    }
    @keyframes load {
      0% { width: 0; } 50% { width: 70%; } 100% { width: 100%; }
    }

    .splash-version {
      position: absolute; bottom: 28px;
      color: #5B6578; font-size: 12px; font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ═══ الأزرار العائمة ═══ */
    .float-btn {
      position: fixed; bottom: 22px; left: 50%;
      transform: translateX(-50%);
      z-index: 2000; display: none;
      align-items: center; gap: 9px;
      border: none; cursor: pointer;
      padding: 14px 26px; border-radius: 50px;
      font-family: inherit; font-size: 14px; font-weight: 700;
      color: #fff; text-decoration: none;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
      animation: slideUp .5s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translate(-50%, 30px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    #installBanner {
      background: linear-gradient(135deg, #C9A24B, #8E7333);
      color: #0B1018;
    }
    #fallbackBtn {
      background: linear-gradient(135deg, #C1543F, #A33E2E);
    }

    /* ═══ دليل تثبيت آيفون ═══ */
    #iosBanner {
      position: fixed; bottom: 22px; left: 50%;
      transform: translateX(-50%);
      z-index: 2000; display: none; max-width: 92%;
      background: rgba(11,16,24,0.96);
      border: 1px solid rgba(201,162,75,0.3);
      color: #EDEFF3; padding: 14px 18px;
      border-radius: 16px;
      font-size: 12.5px; font-weight: 600; line-height: 1.9;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    #iosBanner b { color: #C9A24B; }

    /* ═══ مؤشر حالة الاتصال ═══ */
    #connectionStatus {
      position: fixed; top: 12px; left: 12px;
      z-index: 3000; display: none;
      align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
      background: rgba(193,84,63,0.95);
      color: #fff;
      animation: slideDown .3s ease;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #connectionStatus .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #fff; animation: blink 1.2s infinite;
    }
    @keyframes blink { 50% { opacity: 0.3; } }
  </style>
</head>
<body>

  <!-- ═══ مؤشر عدم الاتصال ═══ -->
  <div id="connectionStatus">
    <span class="dot"></span>
    لا يوجد اتصال بالإنترنت
  </div>

  <!-- ═══ شاشة الإقلاع ═══ -->
  <div id="splash">
    <div class="splash-logo">💧</div>
    <div class="splash-title">تحدي ملئ الأزايز</div>
    <div class="splash-sub">بسملة ـ حمزة ـ عزالدين</div>
    <div class="splash-loader"><span></span></div>
    <div class="splash-version">v2.0.0</div>
  </div>

  <!-- ═══ iframe التطبيق ═══ -->
  <iframe id="appFrame"
    src=""
    allow="fullscreen; clipboard-write"
    title="مركز إرسال الرسائل">
  </iframe>

  <!-- ═══ الأزرار العائمة ═══ -->
  <button id="installBanner" class="float-btn" onclick="installApp()">
    📲 تثبيت التطبيق
  </button>
  <a id="fallbackBtn" class="float-btn" href="#" target="_blank" rel="noopener">
    🔗 فتح التطبيق مباشرة
  </a>

  <!-- ═══ دليل آيفون ═══ -->
  <div id="iosBanner">
    📲 <b>لتثبيت التطبيق على iPhone:</b><br>
    1️⃣ اضغط زر المشاركة <b>⎋</b> أسفل Safari<br>
    2️⃣ اختر «إضافة إلى شاشة البداية» <b>+</b><br>
    3️⃣ اضغط «إضافة» — وسيفتح كتطبيق مستقل
  </div>

  <script src="./config.js"></script>
  <script>
    // ── تطبيق الإعدادات ──
    var APP_URL = PWA_CONFIG.APP_URL;
    document.getElementById('fallbackBtn').href = APP_URL;

    var frame = document.getElementById('appFrame');
    var splash = document.getElementById('splash');

    // التحقق من الرابط
    if (APP_URL.indexOf('YOUR_DEPLOYMENT_ID') !== -1) {
      splash.innerHTML =
        '<div class="splash-logo">⚠️</div>' +
        '<div class="splash-title">الإعداد غير مكتمل</div>' +
        '<div class="splash-sub">عدّل APP_URL في ملف config.js</div>';
    } else {
      frame.src = APP_URL;
    }

    // ── إخفاء الإقلاع عند التحميل ──
    frame.addEventListener('load', function () {
      setTimeout(function () {
        splash.classList.add('hide');
        frame.classList.add('show');
      }, PWA_CONFIG.SPLASH_DURATION);
    });

    // ── خطة الطوارئ ──
    setTimeout(function () {
      if (!splash.classList.contains('hide')) {
        splash.style.opacity = '.35';
        document.getElementById('fallbackBtn').style.display = 'flex';
      }
    }, PWA_CONFIG.LOAD_TIMEOUT);

    // ── مؤشر حالة الاتصال ──
    var statusEl = document.getElementById('connectionStatus');
    function updateConnectionStatus() {
      statusEl.style.display = navigator.onLine ? 'none' : 'flex';
    }
    window.addEventListener('online', updateConnectionStatus);
    window.addEventListener('offline', updateConnectionStatus);
    updateConnectionStatus();

    // ── تثبيت PWA (أندرويد/كروم) ──
    var deferredPrompt = null;
    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
    }

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(function () {
        if (!isStandalone()) {
          document.getElementById('installBanner').style.display = 'flex';
        }
      }, PWA_CONFIG.INSTALL_PROMPT_DELAY);
    });

    function installApp() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function (c) {
        if (c.outcome === 'accepted') {
          document.getElementById('installBanner').style.display = 'none';
        }
        deferredPrompt = null;
      });
    }

    // ── دليل آيفون ──
    (function () {
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS && !isStandalone()) {
        setTimeout(function () {
          document.getElementById('iosBanner').style.display = 'block';
        }, 2500);
      }
    })();

    // ── Service Worker ──
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (e) {
          console.warn('SW:', e);
        });
      });
    }
  </script>
</body>
</html>
